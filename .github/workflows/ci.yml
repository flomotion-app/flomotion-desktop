name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: flomotion-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: flomotion-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: flomotion-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: flomotion-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-pkg/flomotion
          cp src-tauri/target/${{ matrix.target }}/release/flomotion-desktop dist-pkg/flomotion/flomotion
          cp AGENT.md LICENSE README.md dist-pkg/flomotion/
          if [ "${{ runner.os }}" = "macOS" ]; then codesign --force --sign - dist-pkg/flomotion/flomotion; fi
          tar -C dist-pkg -czf ${{ matrix.archive }} flomotion
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-pkg/flomotion | Out-Null
          Copy-Item src-tauri/target/${{ matrix.target }}/release/flomotion-desktop.exe dist-pkg/flomotion/flomotion.exe
          Copy-Item AGENT.md, LICENSE, README.md dist-pkg/flomotion/
          Compress-Archive -Path dist-pkg/flomotion -DestinationPath ${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
